[hooks]
enter = "git pull && mise tasks run setup"

[tools]
"github:dyoshikawa/rulesync" = "latest"

[tasks.setup]
run = [
    "mise install",
    "GH_TOKEN=$(gh auth token) rulesync install",
    # スキル名とフォルダ名が一致するようにフォルダ名を書き換える
    "rm -rf .rulesync/skills/.curated/ast-grep-outline",
    "mv .rulesync/skills/.curated/outline .rulesync/skills/.curated/ast-grep-outline",
    # pstack のエージェントを取得する
    "mise tasks run update-subagents",
    "rulesync generate",
    "rulesync generate --targets antigravity-cli,opencode --features subagents",
    # git で差分が出ないようにフォルダ名をもとに戻す
    "mv .rulesync/skills/.curated/ast-grep-outline .rulesync/skills/.curated/outline",
    # pstack でハーネスごとにモデルの参照箇所を書き換える
    "sed -i '' -E 's@(~/.cursor/rules/)?pstack-models\\.mdc@~/.gemini/antigravity-cli/skills/pstack-mod-agy/SKILL.md@g' ~/.gemini/antigravity-cli/skills/*/SKILL.md",
    "sed -i '' -E 's@(~/.cursor/rules/)?pstack-models\\.mdc@~/.agents/skills/pstack-mod-opencode/SKILL.md@g' ~/.agents/skills/*/SKILL.md",
    # pstack のエージェントが参照するスキルのパスを書き換える
    "sed -i '' -E 's@~/.cursor/plugins/@~/.agents/skills/@g' ~/.gemini/config/agents/poteto-agent.md",
    "sed -i '' -E 's@~/.cursor/plugins/@~/.agents/skills/@g' ~/.config/opencode/agents/poteto-agent.md",
]

[tasks.update-skills]
run = ["GH_TOKEN=$(gh auth token) rulesync install --update", "mise setup"]

[tasks.update-subagents]
alias = ["update-agents", "fetch-subagents", "fetch-agents"]
description = "Fetch agents from cursor/plugins pstack/agents into .rulesync/subagents"
run = """
tmpdir=$(mktemp -d)
trap 'rm -rf "$tmpdir"' EXIT
chmod 755 "$tmpdir"

gh api repos/cursor/plugins/contents/pstack/agents --jq '.[] | select(.type == "file") | .download_url' | while IFS= read -r url; do
    curl -sSfL "$url" -o "$tmpdir/${url##*/}"
done

if [ -n "$(ls -A "$tmpdir")" ]; then
    rm -rf .rulesync/subagents
    mkdir -p .rulesync
    mv "$tmpdir" .rulesync/subagents
    trap - EXIT
else
    echo "No agent files downloaded." >&2
    exit 1
fi
"""
