[hooks]
enter = "mise tasks run setup"

[tools]
"github:dyoshikawa/rulesync" = "latest"

[tasks.setup]
run = [
    "mise install",
    "GH_TOKEN=$(gh auth token) rulesync install",
    "rulesync generate",
    "ln -f -s $(pwd)/.agents/skills/ask-matt ~/.agents/skills/ask-matt",
    "ln -f -s $(pwd)/.agents/skills/code-review ~/.agents/skills/code-review",
    "ln -f -s $(pwd)/.agents/skills/codebase-design ~/.agents/skills/codebase-design",
    "ln -f -s $(pwd)/.agents/skills/diagnosing-bugs ~/.agents/skills/diagnosing-bugs",
    "ln -f -s $(pwd)/.agents/skills/domain-modeling ~/.agents/skills/domain-modeling",
    "ln -f -s $(pwd)/.agents/skills/grill-me ~/.agents/skills/grill-me",
    "ln -f -s $(pwd)/.agents/skills/grill-with-docs ~/.agents/skills/grill-with-docs",
    "ln -f -s $(pwd)/.agents/skills/grilling ~/.agents/skills/grilling",
    "ln -f -s $(pwd)/.agents/skills/handoff ~/.agents/skills/handoff",
    "ln -f -s $(pwd)/.agents/skills/implement ~/.agents/skills/implement",
    "ln -f -s $(pwd)/.agents/skills/improve-codebase-architecture ~/.agents/skills/improve-codebase-architecture",
    "ln -f -s $(pwd)/.agents/skills/prototype ~/.agents/skills/prototype",
    "ln -f -s $(pwd)/.agents/skills/research ~/.agents/skills/research",
    "ln -f -s $(pwd)/.agents/skills/setup-matt-pocock-skills ~/.agents/skills/setup-matt-pocock-skills",
    "ln -f -s $(pwd)/.agents/skills/tdd ~/.agents/skills/tdd",
    "ln -f -s $(pwd)/.agents/skills/to-questionnaire ~/.agents/skills/to-questionnaire",
    "ln -f -s $(pwd)/.agents/skills/to-spec ~/.agents/skills/to-spec",
    "ln -f -s $(pwd)/.agents/skills/to-tickets ~/.agents/skills/to-tickets",
    "ln -f -s $(pwd)/.agents/skills/triage ~/.agents/skills/triage",
    "ln -f -s $(pwd)/.agents/skills/wait-what ~/.agents/skills/wait-what",
    "ln -f -s $(pwd)/.agents/skills/wayfinder ~/.agents/skills/wayfinder",
    "ln -f -s $(pwd)/.agents/skills/wizard ~/.agents/skills/wizard",
    "ln -f -s $(pwd)/.agents/skills/writing-for-agents ~/.agents/skills/writing-for-agents",
]
